<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Character.XI Browser</title>
<!-- Tailwind CSS CDN for modern styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="stylesheet" href="styles.css?v=10" />
<style>
  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* Input & Control Theme Overrides */
  select, input[type="search"], input[type="text"] {
    background-color: #0b1017 !important;
    border: 1px solid #1e293b !important;
    color: #f1f5f9 !important;
    transition: all 0.2s ease;
  }
  select:focus, input[type="search"]:focus, input[type="text"]:focus {
    border-color: #6366f1 !important;
    outline: none !important;
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2) !important;
  }

  /* Navigation Sidebar Tabs */
  .sideSection .tab {
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sideSection .tab:hover {
    color: #f1f5f9;
    background: #1e293b/60;
  }
  .sideSection .tab.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(79, 70, 229, 0.15));
    border-color: rgba(99, 102, 241, 0.4);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
  }

  /* Tags & Filters */
  .sideLabel {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #818cf8;
    margin-bottom: 8px;
    display: block;
  }
  
  #tagListWrap {
    max-height: 220px;
    overflow-y: auto;
    padding-right: 4px;
  }

  #tagOptions .tag-option, #tagActive .tag-active-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #0b1017;
    border: 1px solid #1e293b;
    color: #cbd5e1;
    margin: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #tagOptions .tag-option:hover {
    border-color: #6366f1;
    color: #ffffff;
  }

  /* Cards Grid Layout */
  #grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }

  @media (max-width: 1100px) {
    #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 800px) {
    #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 520px) {
    #grid { grid-template-columns: 1fr; }
  }

  .card {
    background: #161f2e;
    border: 1px solid rgba(30, 41, 59, 0.8);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(99, 102, 241, 0.4);
    box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.1);
  }

  .card .thumbLink {
    width: 100%;
    height: 200px;
    background: #0b1017;
    overflow: hidden;
    display: block;
    position: relative;
  }
  .card .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .card:hover .thumb {
    transform: scale(1.04);
  }

  .card .body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 8px;
  }

  .card .name {
    font-size: 15px;
    font-weight: 700;
    color: #f8fafc;
    line-height: 1.3;
  }

  .card .stars {
    font-size: 12px;
    color: #fbbf24;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card .desc {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .card .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  .card .tags span {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #0b1017;
    border: 1px solid #1e293b;
    color: #a5b4fc;
  }

  .card .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(30, 41, 59, 0.8);
  }

  .card .installBtn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f46e5, #3b82f6);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
  }
  .card .installBtn:hover {
    background: linear-gradient(135deg, #4338ca, #2563eb);
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
  }

  .card .uninstallBtn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .card .uninstallBtn:hover {
    background: rgba(239, 68, 68, 0.25);
    color: #ffffff;
  }
  .static-browser .card-actions {
    display: none;
  }
</style>
</head>
<body class="bg-[#0b0f17] text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header Navigation -->
  <header class="border-b border-slate-800/80 bg-[#0f172a]/80 backdrop-blur sticky top-0 z-50">
    <div class="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button id="menuBtn" aria-label="Open filters" aria-expanded="false" aria-controls="sidebar" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg bg-slate-800/60 border border-slate-700/60 transition">
          <i class="fa-solid fa-bars text-base"></i>
        </button>
        <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-compass text-white text-base"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Browser</h1>
          <p class="text-xs text-slate-400 hidden sm:block">Explore Roles & Stories</p>
        </div>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-slate-800/70 hover:bg-slate-700/80 border border-slate-700/60 rounded-lg transition-all">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
    </div>
  </header>

  <div id="scrim" hidden class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden"></div>

  <!-- Main Responsive Layout -->
  <div class="layout w-full px-4 sm:px-6 lg:px-8 py-6 flex-1 grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
    
    <!-- Sidebar / Filters (3 Cols) -->
    <aside id="sidebar" class="md:col-span-2 space-y-4 bg-[#161f2e] border border-slate-800/80 rounded-2xl p-4 shadow-xl">
      <!-- Section Tabs -->
      <nav class="sideSection space-y-1">
        <button id="tabRoles" class="tab active">
          <i class="fa-solid fa-user-ninja w-4"></i> Roles
        </button>
        <button id="tabStories" class="tab">
          <i class="fa-solid fa-book-open w-4"></i> Stories
        </button>
      </nav>

      <hr class="border-slate-800/80" />

      <!-- Tag Filtering -->
      <div class="sideSection space-y-2">
        <label class="sideLabel">Filter by tag (match all)</label>
        <div id="tagListWrap" class="space-y-1">
          <div id="tagOptions"></div>
        </div>
        <div id="tagActive" class="pt-2 flex flex-wrap gap-1"></div>
      </div>

      <hr class="sideDiv border-slate-800/80" />

      <!-- Contributors Section -->
      <div class="sideSection space-y-2">
        <h3 class="sideLabel">Contributors</h3>
        <div id="contribList" class="text-xs text-slate-400 space-y-1"></div>
      </div>
    </aside>

    <!-- Main Cards & Grid Content Column (9 Cols) -->
    <main id="mainCol" class="md:col-span-10 space-y-5">
      
      <!-- Top Search & Sorting Bar -->
      <div class="browseBar bg-[#161f2e] border border-slate-800/80 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4" id="browseTop">
        <div class="bbLeft flex-1 flex items-center gap-3">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input id="searchInput" type="search" placeholder="Search roles or stories..." autocomplete="off" class="w-full rounded-xl pl-9 pr-3 py-2 text-xs" />
          </div>
          <span id="resultCount" class="text-xs text-slate-400 whitespace-nowrap font-medium"></span>
        </div>

        <div class="pager text-xs text-slate-400 font-medium" id="pagerTop" hidden></div>

        <div class="bbRight flex items-center gap-2">
          <label class="sortLabel text-xs text-slate-400 font-medium whitespace-nowrap" for="sortSel">Sort</label>
          <select id="sortSel" title="Sort order" class="rounded-xl px-3 py-1.5 text-xs">
            <option value="sfw-stars-date">SFW/Stars/Date</option>
            <option value="nsfw-stars-date">NSFW/Stars/Date</option>
            <option value="stars-newest">Stars/Newest</option>
            <option value="stars-oldest">Stars/Oldest</option>
            <option value="installed">Installed only</option>
          </select>
        </div>
      </div>

      <!-- Grid Container for Role / Story Cards -->
      <div id="grid"></div>

      <!-- Bottom Pagination -->
      <div class="pager text-xs text-slate-400 font-medium text-center py-2" id="pagerBottom" hidden></div>
    </main>
  </div>

  <!-- Hidden Card Template -->
  <template id="cardTpl">
    <article class="card">
      <a class="thumbLink" target="_blank">
        <img class="thumb" width="250" height="250" loading="lazy" alt="" />
      </a>
      <div class="body">
        <h2 class="name"></h2>
        <div class="stars" hidden></div>
        <p class="desc"></p>
        <div class="tags"></div>
        <div class="card-actions">
          <button class="installBtn" hidden>Install</button>
          <button class="uninstallBtn" hidden>Uninstall</button>
        </div>
      </div>
    </article>
  </template>

  <!-- External Script -->
  <script src="app.js?v=18"></script>
</body>
</html>
